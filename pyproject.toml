[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oca"
version = "0.2.0"
description = "Open Coding Agent: an open-source, open-weight coding agent stack in one command"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guillaume Mougeot" }]
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=0.34",
    "platformdirs>=4.2",
    "rich>=13.7",
    "tomli-w>=1.0",
    "typer>=0.12",
    # GPL-3.0, same author; pinned commit for reproducible installs.
    "ucloud-api @ git+https://github.com/GuillaumeMougeot/ucloud-api@ab86d39b51bc380ad6ee05fcd1c7894af7a459a3",
]

[project.urls]
Repository = "https://github.com/GuillaumeMougeot/oca"

[project.scripts]
oca = "oca.cli:entrypoint"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.1", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/oca"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.mypy.overrides]]
module = ["ucloud_api", "ucloud_api.*"]  # ships no py.typed marker yet
ignore_missing_imports = true
