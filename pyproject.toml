[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oca"
version = "0.1.0"
description = "Open Coding Agent: an open-source, open-weight coding agent stack in one command"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guillaume Mougeot" }]
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=0.34",
    "platformdirs>=4.2",
    "rich>=13.7",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/GuillaumeMougeot/oca"

[project.scripts]
oca = "oca.cli:entrypoint"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.1", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/oca"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
